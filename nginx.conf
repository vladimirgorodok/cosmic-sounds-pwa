server {
    listen 3000;
    server_name _;

    root /app;
    index index.html;

    # Serve the app directly at / so the preview iframe gets a 200 (not a
    # redirect). Relative asset refs (css/, js/, images/, icons/) resolve from
    # the repo root.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The PWA is scoped to /cosmic-sounds-pwa/ (manifest.json start_url/scope and
    # the absolute precache URLs in service-worker.js). Strip the prefix and
    # serve the same files so those absolute paths resolve too.
    location /cosmic-sounds-pwa/ {
        rewrite ^/cosmic-sounds-pwa/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
